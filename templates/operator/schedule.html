{% extends "base_dashboard.html" %}
{% block heading %}Lịch sạc thông minh{% endblock %}
{% block content %}
<div class="container-fluid">

  <div class="card mb-3">
    <div class="card-body">
      <h5>Thiết lập lịch sạc</h5>

      <div class="row align-items-end">
        <div class="col-md-4">
          <label for="hubId" class="form-label">Chọn Hub</label>
          <input
            type="text"
            id="hubId"
            class="form-control"
            placeholder="Nhập mã Hub, ví dụ H1">
        </div>

        <div class="col-md-3">
          <button
            class="btn btn-primary"
            onclick="generateSchedule()">
            Tạo lịch tự động
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5>Bảng lịch sạc</h5>

      <div class="table-responsive">
        <table class="table table-bordered table-hover">
          <thead>
            <tr>
              <th>Xe</th>
              <th>Cổng sạc</th>
              <th>Khung giờ</th>
              <th>Pin (%)</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>

          <tbody id="scheduleBody">
            <tr>
              <td colspan="6" class="text-center">
                Chưa có lịch sạc
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <button
          class="btn btn-success"
          onclick="approveSchedule()"
          id="approveButton"
          disabled>
          Phê duyệt lịch
        </button>
      </div>
    </div>
  </div>

  <div id="message" class="mt-3"></div>

</div>

<script>
let currentSchedule = [];

async function generateSchedule() {
    const hubId = document.getElementById("hubId").value.trim();

    if (!hubId) {
        showMessage("Vui lòng nhập mã Hub.", "danger");
        return;
    }

    try {
        const response = await fetch(
            `/api/hubs/${encodeURIComponent(hubId)}/charging-schedule/generate`,
            { method: "POST" }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
            showMessage(result.message || "Không thể tạo lịch.", "danger");
            return;
        }

        currentSchedule = result.data;
        renderSchedule();

        document.getElementById("approveButton").disabled =
            currentSchedule.length === 0;

        showMessage("Đã tạo lịch sạc.", "success");

    } catch (error) {
        showMessage("Lỗi kết nối API.", "danger");
    }
}


function renderSchedule() {
    const tbody = document.getElementById("scheduleBody");

    tbody.innerHTML = "";

    if (currentSchedule.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center">
                    Không có dữ liệu lịch sạc
                </td>
            </tr>`;
        return;
    }

    currentSchedule.forEach((item, index) => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${escapeHTML(item.vehicleId || "N/A")}</td>

            <td>
                <input
                    class="form-control"
                    value="${escapeHTML(item.portId)}"
                    onchange="editSchedule(${index}, 'portId', this.value)">
            </td>

            <td>
                <input
                    class="form-control"
                    value="${escapeHTML(item.timeSlot)}"
                    onchange="editSchedule(${index}, 'timeSlot', this.value)">
            </td>

            <td>${Number(item.batteryLevel)}</td>

            <td>${escapeHTML(item.status)}</td>

            <td>
                <button
                    class="btn btn-sm btn-outline-primary"
                    onclick="validateCurrentSchedule()">
                    Kiểm tra
                </button>
            </td>
        `;

        tbody.appendChild(row);
    });
}


async function editSchedule(index, field, value) {
    const changes = [{
        id: currentSchedule[index].id,
        [field]: value
    }];

    try {
        const response = await fetch("/api/charging-schedule/edit", {
            method: "PATCH",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                schedule: currentSchedule,
                changes: changes
            })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
            showMessage(result.message || "Chỉnh sửa không hợp lệ.", "danger");
            renderSchedule();
            return;
        }

        currentSchedule = result.data;
        renderSchedule();

        showMessage("Đã cập nhật lịch.", "success");

    } catch (error) {
        showMessage("Lỗi kết nối API.", "danger");
        renderSchedule();
    }
}


async function validateCurrentSchedule() {
    try {
        const response = await fetch("/api/charging-schedule/validate", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                schedule: currentSchedule
            })
        });

        const result = await response.json();

        showMessage(
            result.ok
                ? "Lịch sạc hợp lệ."
                : result.message || "Lịch sạc không hợp lệ.",
            result.ok ? "success" : "danger"
        );

    } catch (error) {
        showMessage("Lỗi kết nối API.", "danger");
    }
}


async function approveSchedule() {
    if (currentSchedule.length === 0) {
        showMessage("Chưa có lịch để phê duyệt.", "danger");
        return;
    }

    try {
        const response = await fetch("/api/charging-schedule/approve", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                schedule: currentSchedule
            })
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
            showMessage(result.message || "Không thể phê duyệt.", "danger");
            return;
        }

        currentSchedule = result.data;
        renderSchedule();

        document.getElementById("approveButton").disabled = true;

        showMessage("Đã phê duyệt và lưu lịch sạc.", "success");

    } catch (error) {
        showMessage("Lỗi kết nối API.", "danger");
    }
}


function showMessage(message, type) {
    const element = document.getElementById("message");

    element.className = `alert alert-${type} mt-3`;
    element.textContent = message;
}


function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}
</script>

{% endblock %}
